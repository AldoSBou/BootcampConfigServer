server:
  port: 9001
spring:
  application:
    name: config-server
#Config Server Configuration
  cloud:
    config:
      server:
        git:
          uri: https://github.com/AldoSBou/BootcampConfigServerFiles
          defaultLabel: develop
          cloneOnStart: true
          refreshRate: 15 #Se busca cada 5 segundos una nueva config

#Eureka Client Configuration
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
